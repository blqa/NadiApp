<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestras Finanzas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf2f8; /* Soft pink-50 pastel background */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #fbcfe8; /* pink-200 */
            border-radius: 20px;
        }

        .modal-enter {
            opacity: 0;
            transform: scale(0.95) translateY(10px);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: opacity 300ms, transform 300ms cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen relative">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-12 h-12 border-4 border-pink-200 border-t-pink-500 rounded-full animate-spin mb-4"></div>
        <p class="text-pink-500 font-semibold animate-pulse">Cargando nuestras finanzas...</p>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="max-w-md mx-auto bg-[#fdf2f8] min-h-screen shadow-lg pb-24 hidden relative overflow-hidden">
        
        <!-- Header / Total Balance -->
        <header class="bg-white rounded-b-[2.5rem] shadow-sm p-8 mb-6 relative z-10">
            <h1 class="text-2xl font-extrabold text-pink-400 text-center mb-6 tracking-wide">NadiNero 💕</h1>
            <div class="text-center">
                <p class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-1">Balance Total</p>
                <h2 class="text-4xl font-black text-slate-800 tracking-tight" id="totalBalanceView">$0.00</h2>
            </div>
        </header>

        <!-- Accounts Section -->
        <section class="px-5 mb-8">
            <div class="flex justify-between items-center mb-4 pl-1">
                <h3 class="text-lg font-bold text-slate-700">Mis Cuentas</h3>
                <button onclick="openModal('accountModal')" class="bg-purple-100 text-purple-600 px-4 py-1.5 rounded-full text-sm font-bold shadow-sm hover:bg-purple-200 transition-colors flex items-center gap-1 active:scale-95">
                    <span>+</span> Cuenta
                </button>
            </div>
            
            <!-- Accounts List Container -->
            <div id="accountsList" class="grid grid-cols-1 gap-3">
                <!-- Accounts will be injected here by JS -->
                <p id="noAccountsMsg" class="text-center text-slate-400 text-sm py-4 hidden">Aún no hay cuentas. ¡Agrega una para empezar!</p>
            </div>
        </section>

        <!-- Actions & Recent Movements -->
        <section class="px-5">
            <button onclick="openModal('transactionModal')" class="w-full bg-teal-100 text-teal-700 py-4 rounded-2xl font-bold text-lg shadow-sm hover:bg-teal-200 transition-colors mb-6 active:scale-[0.98] border border-teal-200">
                + Agregar Movimiento
            </button>

            <h3 class="text-lg font-bold text-slate-700 mb-3 pl-1">Últimos Movimientos</h3>
            <div id="transactionsList" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3 max-h-64 overflow-y-auto">
                <!-- Transactions will be injected here by JS -->
                <p id="noTransactionsMsg" class="text-center text-slate-400 text-sm py-2">No hay movimientos recientes.</p>
            </div>
        </section>

    </div>

    <!-- Modal: Add Account -->
    <div id="accountModal" class="fixed inset-0 bg-slate-900/40 z-40 hidden flex-col items-center justify-end sm:justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl modal-content transform transition-all">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold text-purple-600">Nueva Cuenta</h3>
                <button onclick="closeModal('accountModal')" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
            </div>
            
            <form id="addAccountForm" onsubmit="handleAddAccount(event)">
                <div class="mb-4">
                    <label class="block text-sm font-bold text-slate-600 mb-1">Nombre de la cuenta</label>
                    <input type="text" id="accName" required placeholder="Ej. Ahorros Boda, Tarjeta de Crédito" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-purple-300 focus:ring-2 focus:ring-purple-100 transition-all text-slate-700">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-bold text-slate-600 mb-1">Tipo de cuenta</label>
                    <select id="accType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-purple-300 focus:ring-2 focus:ring-purple-100 transition-all text-slate-700 appearance-none">
                        <option value="efectivo">💵 Efectivo</option>
                        <option value="debito">💳 Tarjeta de Débito</option>
                        <option value="credito">💳 Tarjeta de Crédito</option>
                        <option value="ahorro">🏦 Ahorro / Inversión</option>
                    </select>
                </div>
                <button type="submit" id="btnSaveAccount" class="w-full bg-purple-500 text-white font-bold rounded-xl py-3 shadow-md shadow-purple-200 hover:bg-purple-600 active:scale-95 transition-all">
                    Crear Cuenta
                </button>
            </form>
        </div>
    </div>

    <!-- Modal: Add Transaction -->
    <div id="transactionModal" class="fixed inset-0 bg-slate-900/40 z-40 hidden flex-col items-center justify-end sm:justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl modal-content transform transition-all">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold text-teal-600">Nuevo Movimiento</h3>
                <button onclick="closeModal('transactionModal')" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
            </div>
            
            <form id="addTransactionForm" onsubmit="handleAddTransaction(event)">
                <!-- Type Toggle -->
                <div class="flex rounded-xl bg-slate-100 p-1 mb-5">
                    <label class="flex-1 text-center cursor-pointer">
                        <input type="radio" name="txType" value="gasto" checked class="peer hidden">
                        <div class="py-2 rounded-lg font-bold text-sm text-slate-400 peer-checked:bg-white peer-checked:text-rose-500 peer-checked:shadow-sm transition-all">
                            Gasto
                        </div>
                    </label>
                    <label class="flex-1 text-center cursor-pointer">
                        <input type="radio" name="txType" value="ingreso" class="peer hidden">
                        <div class="py-2 rounded-lg font-bold text-sm text-slate-400 peer-checked:bg-white peer-checked:text-teal-500 peer-checked:shadow-sm transition-all">
                            Ingreso
                        </div>
                    </label>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold text-slate-600 mb-1">Cantidad</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">$</span>
                        <input type="number" id="txAmount" required min="0.01" step="0.01" placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-4 py-3 outline-none focus:border-teal-300 focus:ring-2 focus:ring-teal-100 transition-all text-slate-700 font-bold text-lg">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-bold text-slate-600 mb-1">Concepto</label>
                    <input type="text" id="txDesc" required placeholder="Ej. Cena, Supermercado, Sueldo" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-300 focus:ring-2 focus:ring-teal-100 transition-all text-slate-700">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-bold text-slate-600 mb-1">Cuenta afectada</label>
                    <select id="txAccountSelect" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-teal-300 focus:ring-2 focus:ring-teal-100 transition-all text-slate-700 appearance-none">
                        <!-- Options injected by JS -->
                    </select>
                </div>

                <button type="submit" id="btnSaveTransaction" class="w-full bg-teal-500 text-white font-bold rounded-xl py-3 shadow-md shadow-teal-200 hover:bg-teal-600 active:scale-95 transition-all">
                    Guardar Movimiento
                </button>
            </form>
        </div>
    </div>

    <!-- Custom Alert Modal (replaces browser alert) -->
    <div id="alertModal" class="fixed inset-0 bg-slate-900/30 z-50 hidden flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 shadow-xl max-w-xs w-full text-center transform scale-95 transition-transform duration-200" id="alertBox">
            <h4 class="text-lg font-bold text-slate-800 mb-2" id="alertTitle">Atención</h4>
            <p class="text-slate-600 mb-6 text-sm" id="alertMessage">Mensaje aquí</p>
            <button onclick="closeAlert()" class="bg-pink-100 text-pink-600 font-bold py-2 px-6 rounded-xl hover:bg-pink-200 active:scale-95 transition-all w-full">Entendido</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Determine environment variables
        const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-nadi-app';
        let firebaseConfigData;
        
        try {
            // Prioritize environment config for sandbox execution
            firebaseConfigData = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
                // Fallback to user provided config if running externally
                apiKey: "AIzaSyBqXPV9LA3j1MY6swbM-d4YqsuxGT37Q7g",
                authDomain: "nadiapp-b44ae.firebaseapp.com",
                projectId: "nadiapp-b44ae",
                storageBucket: "nadiapp-b44ae.firebasestorage.app",
                messagingSenderId: "458286198231",
                appId: "1:458286198231:web:d9801e0dd6ea4fd0ae2f92"
            };
        } catch (e) {
            console.error("Error parsing config", e);
        }

        const app = initializeApp(firebaseConfigData);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // State variables
        let currentUserUid = null;
        let accountsData = [];
        let transactionsData = [];

        // Formatting utilities
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount);
        };

        const getIconForType = (type) => {
            const icons = { 'efectivo': '💵', 'debito': '💳', 'credito': '💳', 'ahorro': '🏦' };
            return icons[type] || '💰';
        };

        const getColorForType = (type) => {
            const colors = { 
                'efectivo': 'bg-green-100 text-green-700 border-green-200', 
                'debito': 'bg-blue-100 text-blue-700 border-blue-200', 
                'credito': 'bg-purple-100 text-purple-700 border-purple-200', 
                'ahorro': 'bg-yellow-100 text-yellow-700 border-yellow-200' 
            };
            return colors[type] || 'bg-slate-100 text-slate-700 border-slate-200';
        };

        // Custom Alert Function (Replacing alert())
        window.showAlert = (title, message) => {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMessage').innerText = message;
            const modal = document.getElementById('alertModal');
            const box = document.getElementById('alertBox');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => { box.classList.remove('scale-95'); box.classList.add('scale-100'); }, 10);
        };

        window.closeAlert = () => {
            const modal = document.getElementById('alertModal');
            const box = document.getElementById('alertBox');
            box.classList.remove('scale-100'); box.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
        };

        // Modal Management
        window.openModal = (id) => {
            const modal = document.getElementById(id);
            const content = modal.querySelector('.modal-content');
            
            if(id === 'transactionModal' && accountsData.length === 0) {
                showAlert('Falta información', 'Primero debes crear al menos una cuenta para agregar movimientos.');
                return;
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Animation trick
            content.classList.add('modal-enter');
            requestAnimationFrame(() => {
                content.classList.remove('modal-enter');
                content.classList.add('modal-enter-active');
            });
        };

        window.closeModal = (id) => {
            const modal = document.getElementById(id);
            const content = modal.querySelector('.modal-content');
            content.classList.remove('modal-enter-active');
            content.classList.add('modal-enter');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                content.classList.remove('modal-enter');
                // Reset forms on close
                if(id === 'accountModal') document.getElementById('addAccountForm').reset();
                if(id === 'transactionModal') document.getElementById('addTransactionForm').reset();
            }, 300);
        };

        // Authentication Flow
        async function authenticateUser() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                showAlert("Error de conexión", "No se pudo iniciar sesión en la base de datos.");
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                initDataListeners();
                
                // Hide loading screen smoothly
                const loader = document.getElementById('loadingOverlay');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.classList.add('hidden');
                    document.getElementById('appContainer').classList.remove('hidden');
                }, 300);
            }
        });

        // Initialize Firestore Listeners
        function initDataListeners() {
            if (!currentUserUid) return;

            // Enforce Strict Paths: /artifacts/{appId}/users/{userId}/{collectionName}
            const accountsRef = collection(db, 'artifacts', envAppId, 'users', currentUserUid, 'accounts');
            const txRef = collection(db, 'artifacts', envAppId, 'users', currentUserUid, 'transactions');

            // Listen to Accounts
            onSnapshot(accountsRef, (snapshot) => {
                accountsData = [];
                snapshot.forEach((doc) => {
                    accountsData.push({ id: doc.id, ...doc.data() });
                });
                // Sort accounts roughly by creation date locally (since no complex queries allowed)
                accountsData.sort((a, b) => {
                    if(a.createdAt && b.createdAt) return b.createdAt.toMillis() - a.createdAt.toMillis();
                    return 0;
                });
                updateUI();
                updateTransactionAccountSelect();
            }, (error) => {
                console.error("Error fetching accounts:", error);
                showAlert("Error", "No se pudieron cargar las cuentas.");
            });

            // Listen to Transactions
            onSnapshot(txRef, (snapshot) => {
                transactionsData = [];
                snapshot.forEach((doc) => {
                    transactionsData.push({ id: doc.id, ...doc.data() });
                });
                
                // Sort transactions by date descending locally
                transactionsData.sort((a, b) => {
                    if(a.createdAt && b.createdAt) return b.createdAt.toMillis() - a.createdAt.toMillis();
                    return 0;
                });
                
                updateUI();
            }, (error) => {
                console.error("Error fetching transactions:", error);
            });
        }

        // Main UI Update Function
        function updateUI() {
            const listEl = document.getElementById('accountsList');
            const noAccMsg = document.getElementById('noAccountsMsg');
            const txListEl = document.getElementById('transactionsList');
            const noTxMsg = document.getElementById('noTransactionsMsg');
            const totalBalanceView = document.getElementById('totalBalanceView');
            
            let totalGlobalBalance = 0;
            if(listEl) listEl.innerHTML = '';
            
            // Render Accounts and calculate individual balances based on transactions
            if (accountsData.length === 0) {
                if(noAccMsg) {
                    noAccMsg.classList.remove('hidden');
                    noAccMsg.classList.add('block');
                }
            } else {
                if(noAccMsg) {
                    noAccMsg.classList.add('hidden');
                    noAccMsg.classList.remove('block');
                }
                
                accountsData.forEach(account => {
                    // Calculate balance for this specific account
                    let accountBalance = 0;
                    transactionsData.forEach(tx => {
                        if(tx.accountId === account.id) {
                            if(tx.type === 'ingreso') accountBalance += tx.amount;
                            if(tx.type === 'gasto') accountBalance -= tx.amount;
                        }
                    });
                    
                    totalGlobalBalance += accountBalance;

                    // Build Account Card
                    if (listEl) {
                        const card = document.createElement('div');
                        const colorClasses = getColorForType(account.type);
                        
                        card.className = `bg-white border rounded-2xl p-4 flex items-center justify-between shadow-sm hover:shadow-md transition-shadow cursor-pointer ${colorClasses.split(' ')[2]}`; // apply border color
                        card.innerHTML = `
                            <div class="flex items-center gap-3">
                                <div class="${colorClasses} w-10 h-10 rounded-full flex items-center justify-center text-xl shadow-inner">
                                    ${getIconForType(account.type)}
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-700 leading-tight">${account.name}</h4>
                                    <span class="text-xs font-semibold uppercase tracking-wider opacity-70">${account.type}</span>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-black ${accountBalance < 0 ? 'text-rose-500' : 'text-slate-800'} text-lg">${formatMoney(accountBalance)}</p>
                            </div>
                        `;
                        listEl.appendChild(card);
                    }
                });
            }

            // Update Total Balance Header
            if (totalBalanceView) {
                totalBalanceView.innerText = formatMoney(totalGlobalBalance);
                if(totalGlobalBalance < 0) {
                    totalBalanceView.classList.add('text-rose-500');
                    totalBalanceView.classList.remove('text-slate-800');
                } else {
                    totalBalanceView.classList.remove('text-rose-500');
                    totalBalanceView.classList.add('text-slate-800');
                }
            }

            // Render Recent Transactions
            if(txListEl) txListEl.innerHTML = '';
            if (transactionsData.length === 0) {
                if(txListEl && noTxMsg) txListEl.appendChild(noTxMsg);
            } else {
                // Show max 10 recent transactions for performance/UI constraints
                const recentTx = transactionsData.slice(0, 10);
                recentTx.forEach(tx => {
                    // Find account name
                    const acc = accountsData.find(a => a.id === tx.accountId);
                    const accName = acc ? acc.name : 'Cuenta Eliminada';
                    
                    const isIncome = tx.type === 'ingreso';
                    if (txListEl) {
                        const txItem = document.createElement('div');
                        txItem.className = "flex justify-between items-center py-2 border-b border-slate-50 last:border-0";
                        txItem.innerHTML = `
                            <div class="flex flex-col">
                                <span class="font-bold text-sm text-slate-700">${tx.desc}</span>
                                <span class="text-xs text-slate-400 font-medium">${accName}</span>
                            </div>
                            <span class="font-bold text-sm ${isIncome ? 'text-teal-500' : 'text-rose-500'}">
                                ${isIncome ? '+' : '-'}${formatMoney(tx.amount)}
                            </span>
                        `;
                        txListEl.appendChild(txItem);
                    }
                });
            }
        }

        // Update Select Dropdown in Transaction Modal
        function updateTransactionAccountSelect() {
            const select = document.getElementById('txAccountSelect');
            select.innerHTML = '';
            accountsData.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc.id;
                opt.textContent = `${getIconForType(acc.type)} ${acc.name}`;
                select.appendChild(opt);
            });
        }

        // Form Handlers
        window.handleAddAccount = async (e) => {
            e.preventDefault();
            if (!currentUserUid) return;

            const name = document.getElementById('accName').value.trim();
            const type = document.getElementById('accType').value;
            const btn = document.getElementById('btnSaveAccount');

            if (!name) return;

            try {
                btn.disabled = true;
                btn.innerText = "Guardando...";
                
                const accountsRef = collection(db, 'artifacts', envAppId, 'users', currentUserUid, 'accounts');
                await addDoc(accountsRef, {
                    name: name,
                    type: type,
                    createdAt: serverTimestamp()
                });

                closeModal('accountModal');
            } catch (error) {
                console.error("Error adding account:", error);
                showAlert("Error", "No se pudo crear la cuenta.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Crear Cuenta";
            }
        };

        window.handleAddTransaction = async (e) => {
            e.preventDefault();
            if (!currentUserUid) return;

            const type = document.querySelector('input[name="txType"]:checked').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const desc = document.getElementById('txDesc').value.trim();
            const accountId = document.getElementById('txAccountSelect').value;
            const btn = document.getElementById('btnSaveTransaction');

            if (!amount || amount <= 0 || !desc || !accountId) {
                showAlert("Campos inválidos", "Por favor revisa la cantidad y el concepto.");
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Guardando...";

                const txRef = collection(db, 'artifacts', envAppId, 'users', currentUserUid, 'transactions');
                await addDoc(txRef, {
                    type: type, // 'ingreso' or 'gasto'
                    amount: amount,
                    desc: desc,
                    accountId: accountId,
                    createdAt: serverTimestamp()
                });

                closeModal('transactionModal');
            } catch (error) {
                console.error("Error adding transaction:", error);
                showAlert("Error", "No se pudo guardar el movimiento.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Guardar Movimiento";
            }
        };

        // Start Auth Flow on load
        authenticateUser();

    </script>
</body>
</html>
