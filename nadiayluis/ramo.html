<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Un ramo para ti · Nadia y Luis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css?v=20261126e">
  <style>
    /* ---------- Colores del prado según la hora ---------- */
    .prado {
      --m1: #a9c6e0; --m2: #8fb3d4; --nieve-monte: #ffffff;
      --l1: #a8d17d; --l2: #86bf5c; --l3: #6aa947;
      --arbol: #4f8f3a; --arbol-2: #3d7a2e; --tronco: #6b4a32;
      --tallo: #5b8a37; --pasto: #5f9a3c; --pasto-2: #4c8530;
      --texto-prado: #1f2a3a; --tinte: #ffffff; --nube: #ffffff; --niebla: 255,255,255;
    }
    .prado[data-hora="amanecer"] {
      --m1: #b4a5d0; --m2: #9284bd; --nieve-monte: #ffe7ef;
      --l1: #a6c48c; --l2: #84ad6e; --l3: #6a9556;
      --arbol: #557d4d; --arbol-2: #436745; --tronco: #6a4a3e;
      --tallo: #5a8545; --pasto: #5b8a49; --pasto-2: #4a7a3c;
      --texto-prado: #fff8f2; --tinte: #fff0ec; --nube: #ffe3e3; --niebla: 255,240,240;
    }
    .prado[data-hora="atardecer"] {
      --m1: #a8698c; --m2: #82517c; --nieve-monte: #ffd9c7;
      --l1: #97a058; --l2: #758a45; --l3: #5a7436;
      --arbol: #42602c; --arbol-2: #334c22; --tronco: #5a3a2a;
      --tallo: #5a7a2e; --pasto: #52722e; --pasto-2: #415e24;
      --texto-prado: #fff6ee; --tinte: #ffd9c2; --nube: #ffcdb8; --niebla: 255,220,200;
    }
    .prado[data-hora="noche"] {
      --m1: #2c3160; --m2: #22274e; --nieve-monte: #9aa3d6;
      --l1: #2b4b3c; --l2: #223f32; --l3: #1b3528;
      --arbol: #16301f; --arbol-2: #102619; --tronco: #22201f;
      --tallo: #3d6b3a; --pasto: #21402a; --pasto-2: #1a3522;
      --texto-prado: #f6eaf2; --tinte: #8e96d0; --nube: #3e4577; --niebla: 150,160,205;
    }
    .prado[data-clima="nublado"] { --nube: #e6e9ee; }
    .prado[data-clima="lluvia"] { --nube: #8d96a3; }
    .prado[data-hora="noche"][data-clima="nublado"], .prado[data-hora="noche"][data-clima="lluvia"] { --nube: #2f3456; }

    html, body { height: 100%; }
    body.pagina-ramo { overflow: hidden; overscroll-behavior: none; }
    body.pagina-ramo > .pie { display: none; }

    /* ---------- El prado ---------- */
    .prado {
      position: fixed; inset: 0; overflow: hidden; background: #cfe6f5;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      cursor: grab;
    }
    .prado.juntando { cursor: grabbing; }
    .prado svg .m1, .prado svg .m2, .prado svg .l1, .prado svg .l2, .prado svg .l3, .prado svg .nv { transition: fill 1.6s ease; }
    .m1 { fill: var(--m1); } .m2 { fill: var(--m2); } .nv { fill: var(--nieve-monte); }
    .l1 { fill: var(--l1); } .l2 { fill: var(--l2); } .l3 { fill: var(--l3); }

    /* cielos: uno por hora, se cruzan suavemente */
    .cielo { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; pointer-events: none; }
    .cielo.c-amanecer { background: linear-gradient(180deg, #3b4a86 0%, #a88fc8 20%, #f7a8a8 33%, #ffd8b0 40%); }
    .cielo.c-dia { background: linear-gradient(180deg, #5fb4ea 0%, #9fd6f6 22%, #d6eefb 36%, #eef8ff 42%); }
    .cielo.c-atardecer { background: linear-gradient(180deg, #2f2463 0%, #7b3f86 15%, #e4607a 28%, #ff9e6b 36%, #ffd08a 42%); }
    .cielo.c-noche { background: linear-gradient(180deg, #070a24 0%, #141a44 20%, #262b5e 36%, #343570 42%); }
    .prado[data-hora="amanecer"] .c-amanecer, .prado[data-hora="dia"] .c-dia,
    .prado[data-hora="atardecer"] .c-atardecer, .prado[data-hora="noche"] .c-noche { opacity: 1; }
    .gris { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.6s, background 1.6s; background: linear-gradient(180deg, #8b939e, #b8bec6 42%); }
    .prado[data-clima="nublado"] .gris { opacity: .55; }
    .prado[data-clima="lluvia"] .gris { opacity: .78; background: linear-gradient(180deg, #4d5562, #7c8591 42%); }
    .prado[data-clima="neblina"] .gris { opacity: .35; background: linear-gradient(180deg, #c9ced6, #eef0f3 42%); }
    .prado[data-clima="nieve"] .gris { opacity: .5; background: linear-gradient(180deg, #aab3c2, #e4e8ef 42%); }
    .prado[data-hora="noche"] .gris { background: linear-gradient(180deg, #10132b, #2a2e4a 42%); }

    .estrellas { position: absolute; inset: 0 0 58% 0; opacity: 0; transition: opacity 1.6s; pointer-events: none; }
    .prado[data-hora="noche"] .estrellas { opacity: 1; }
    .prado[data-hora="noche"]:is([data-clima="nublado"], [data-clima="lluvia"], [data-clima="nieve"]) .estrellas { opacity: .15; }
    .prado[data-hora="amanecer"] .estrellas { opacity: .35; }
    .estrellas i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: titila 3s ease-in-out infinite; }
    .estrellas i.grande { width: 3px; height: 3px; box-shadow: 0 0 6px #fff; }
    @keyframes titila { 50% { opacity: .25; } }
    .fugaz { position: absolute; width: 110px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, #fff); opacity: 0; pointer-events: none; }
    .prado[data-hora="noche"][data-clima="despejado"] .fugaz { animation: fugaz 9s ease-in 3s infinite; }
    @keyframes fugaz { 0% { opacity: 0; transform: translate(0, 0) rotate(-24deg); } 3% { opacity: 1; } 9% { opacity: 0; transform: translate(-260px, 116px) rotate(-24deg); } 100% { opacity: 0; transform: translate(-260px, 116px) rotate(-24deg); } }

    /* sol y luna */
    .astro { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
      transition: left 1.8s cubic-bezier(.4,0,.2,1), top 1.8s cubic-bezier(.4,0,.2,1), opacity 1.4s, background 1.4s, box-shadow 1.4s; }
    .astro.sol { width: 78px; height: 78px; left: 80%; top: 25%; background: radial-gradient(circle, #fffbe0 0 40%, #ffe27a 70%);
      box-shadow: 0 0 60px 26px #fff3b080, 0 0 160px 70px #fff6c840; }
    .prado[data-hora="amanecer"] .sol { left: 22%; top: 31%; width: 92px; height: 92px; background: radial-gradient(circle, #fff1d6 0 35%, #ffb27a 72%); box-shadow: 0 0 70px 30px #ffb59a80, 0 0 200px 90px #ffc8a840; }
    .prado[data-hora="atardecer"] .sol { left: 74%; top: 32%; width: 104px; height: 104px; background: radial-gradient(circle, #ffe2b8 0 30%, #ff7b54 75%); box-shadow: 0 0 80px 34px #ff7b5470, 0 0 220px 110px #ffb38a40; }
    .prado[data-hora="noche"] .sol { opacity: 0; top: 50%; }
    .astro.luna { width: 58px; height: 58px; left: 18%; top: 50%; opacity: 0; background: radial-gradient(circle at 38% 38%, #fffdf0, #e8e4cf 70%);
      box-shadow: 0 0 40px 12px #fffbe040, 0 0 120px 50px #c9d0ff30; }
    .astro.luna::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 30% 60%, #d6d0b8 0 9%, transparent 10%), radial-gradient(circle at 62% 30%, #d6d0b8 0 7%, transparent 8%), radial-gradient(circle at 66% 68%, #ddd7c0 0 5%, transparent 6%); }
    .prado[data-hora="noche"] .luna { opacity: 1; top: 26%; }
    .prado:is([data-clima="nublado"], [data-clima="neblina"], [data-clima="nieve"]) .astro { opacity: .35; }
    .prado[data-clima="lluvia"] .astro { opacity: .08; }
    .prado[data-hora="noche"]:not([data-clima="lluvia"]) .sol { opacity: 0; }

    /* nubes y pájaros */
    .nubes, .aves { position: absolute; inset: 0 0 50% 0; pointer-events: none; }
    .nube { position: absolute; left: 0; animation: nube var(--d, 120s) linear var(--r, 0s) infinite; opacity: var(--o, .95); }
    .nube svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .nube svg ellipse, .nube svg rect { fill: var(--nube); transition: fill 1.6s; }
    @keyframes nube { from { transform: translateX(-35vw); } to { transform: translateX(115vw); } }
    .ave { position: absolute; left: 0; width: 18px; height: 8px; animation: vuela-ave var(--d, 40s) linear var(--r, 0s) infinite; opacity: 0; transition: opacity 1s; }
    .prado:is([data-hora="dia"], [data-hora="amanecer"], [data-hora="atardecer"]):is([data-clima="despejado"], [data-clima="nublado"]) .ave { opacity: .75; }
    .ave svg { width: 100%; height: 100%; overflow: visible; animation: aletea .5s ease-in-out infinite alternate; }
    @keyframes aletea { to { transform: scaleY(.35); } }
    @keyframes vuela-ave { from { transform: translate(-10vw, 0); } 50% { transform: translate(50vw, -3vh); } to { transform: translate(110vw, 1vh); } }

    .paisaje { position: absolute; left: 0; right: 0; top: 18%; bottom: 0; pointer-events: none; }
    .paisaje svg { width: 100%; height: 100%; display: block; }
    .flores { position: absolute; inset: 0; z-index: 5; }

    /* capas de luz y clima encima de las flores */
    .tinte { position: absolute; inset: 0; z-index: 6; pointer-events: none; background: var(--tinte); mix-blend-mode: multiply; transition: background 1.6s; }
    .tinte-clima { position: absolute; inset: 0; z-index: 6; pointer-events: none; background: #fff; mix-blend-mode: multiply; transition: background 1.6s; }
    .prado[data-clima="nublado"] .tinte-clima { background: #e4e6ea; }
    .prado[data-clima="lluvia"] .tinte-clima { background: #b9c0ca; }
    .prado[data-clima="nieve"] .tinte-clima { background: #eef1f6; }
    .niebla { position: absolute; left: -20%; right: -20%; pointer-events: none; opacity: 0; transition: opacity 2s;
      background:
        radial-gradient(40% 60% at 20% 50%, rgba(var(--niebla), .75), transparent 70%),
        radial-gradient(35% 55% at 55% 40%, rgba(var(--niebla), .65), transparent 70%),
        radial-gradient(45% 60% at 85% 55%, rgba(var(--niebla), .7), transparent 70%);
      animation: niebla 38s ease-in-out infinite alternate; }
    .niebla.atras { top: 26%; height: 30%; z-index: 4; }
    .niebla.frente { top: 48%; height: 46%; z-index: 7; animation-duration: 30s; animation-direction: alternate-reverse; }
    .niebla.piso { top: 70%; height: 34%; z-index: 7; animation-duration: 24s; }
    @keyframes niebla { from { transform: translateX(-6%); } to { transform: translateX(6%); } }
    .prado[data-clima="neblina"] .niebla { opacity: 1; }
    .prado[data-clima="neblina"] .niebla.frente { opacity: .8; }
    .prado[data-hora="amanecer"]:not([data-clima="neblina"]) .niebla.atras { opacity: .55; }
    .prado[data-clima="lluvia"] .niebla.atras { opacity: .4; }
    .particulas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 8; pointer-events: none; }
    .relampago { position: absolute; inset: 0; z-index: 9; pointer-events: none; background: #fff; opacity: 0; }
    .relampago.brilla { animation: relampago .7s ease-out; }
    @keyframes relampago { 0% { opacity: 0; } 8% { opacity: .75; } 16% { opacity: .1; } 26% { opacity: .55; } 100% { opacity: 0; } }

    /* botón y panel del cielo */
    .cielo-boton {
      position: absolute; right: 1rem; bottom: calc(1.25rem + env(safe-area-inset-bottom)); z-index: 200;
      width: 3.4rem; height: 3.4rem; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
      border: 1px solid color-mix(in srgb, #fff 55%, transparent);
      background: color-mix(in srgb, var(--hoja) 86%, transparent); color: var(--tinta);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 16px 34px -16px #2b183080;
    }
    .cielo-boton svg { width: 1.6rem; height: 1.6rem; }
    .cielo-panel {
      position: absolute; right: 1rem; bottom: calc(5.4rem + env(safe-area-inset-bottom)); z-index: 210;
      width: min(21rem, calc(100% - 2rem)); padding: 1rem 1rem .9rem; border-radius: 22px;
      background: color-mix(in srgb, var(--hoja) 94%, transparent); color: var(--tinta);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 50px -20px #2b1830a0; animation: sube .3s cubic-bezier(.2,.8,.2,1);
    }
    .cielo-panel[hidden] { display: none; }
    .cielo-panel h3 { font-family: var(--sans); font-size: .78rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); margin: 0 0 .5rem; }
    .cielo-panel h3 + .chips { margin-bottom: .9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chips button { display: inline-flex; align-items: center; gap: .35rem; font: inherit; font-size: .9rem; padding: .45rem .75rem; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--polvo); background: transparent; color: inherit; }
    .chips button svg { width: 1rem; height: 1rem; }
    .chips button[aria-pressed="true"] { background: var(--cereza); border-color: var(--cereza); color: #fff; }

    .flor { position: absolute; transform-origin: 50% 100%; pointer-events: none; }
    .flor svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .flor .mece { transform-origin: 0 0; transform-box: view-box; animation: mecer var(--d, 4s) ease-in-out var(--r, 0s) infinite alternate; }
    .flor .toque { pointer-events: all; cursor: pointer; }
    .flor.pasto-mata { pointer-events: none; }
    .flor.pasto-mata .mece { animation-duration: calc(var(--d, 4s) * .8); }
    @keyframes mecer { from { transform: rotate(-2.2deg); } to { transform: rotate(2.6deg); } }
    @keyframes mecer-suave { from { transform: rotate(-.6deg); } to { transform: rotate(.8deg); } }
    .prado[data-clima="lluvia"] .flor .mece { animation-duration: calc(var(--d, 4s) * .55); }
    .flor.cortada { animation: cortar .45s ease-in forwards; }
    @keyframes cortar { to { transform: scaleY(0); opacity: 0; } }
    .flor.nace { animation: nacer 1.1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes nacer { from { transform: scaleY(0); opacity: 0; } 40% { opacity: 1; } }

    .vuela { position: fixed; z-index: 30; pointer-events: none; will-change: transform, opacity; }
    .vuela svg { width: 100%; height: 100%; overflow: visible; }
    .piropo {
      position: fixed; z-index: 31; pointer-events: none; transform: translate(-50%, -50%);
      font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--texto-prado);
      text-shadow: 0 1px 0 color-mix(in srgb, var(--cielo-2) 80%, transparent);
      animation: piropo 1.2s ease-out forwards; white-space: nowrap;
    }
    @keyframes piropo { from { opacity: 0; translate: 0 6px; } 20% { opacity: 1; } to { opacity: 0; translate: 0 -38px; } }

    .guia {
      position: absolute; left: 50%; top: calc(5.2rem + env(safe-area-inset-top)); transform: translateX(-50%);
      width: min(30rem, calc(100% - 2.5rem)); text-align: center; color: var(--texto-prado);
      pointer-events: none; transition: opacity .8s, transform .8s, color 1.6s; z-index: 150; text-shadow: 0 1px 12px #0000002a;
    }
    .guia h1 { font-size: clamp(2.1rem, 8vw, 3.2rem); line-height: 1.02; font-weight: 400; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
    .guia h1 em { color: var(--cereza); }
    .guia p { margin: .6rem 0 0; font-size: 1rem; opacity: .8; }
    .guia.escondida { opacity: 0; transform: translate(-50%, -12px); }

    .dock {
      position: absolute; left: 50%; bottom: calc(1.1rem + env(safe-area-inset-bottom)); transform: translateX(-50%);
      display: flex; align-items: center; gap: .7rem; padding: .45rem 1.2rem .45rem .5rem;
      border-radius: 999px; border: 1px solid color-mix(in srgb, #fff 55%, transparent);
      background: color-mix(in srgb, var(--hoja) 86%, transparent); color: var(--tinta);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 16px 34px -16px #2b183080; font: inherit; cursor: pointer;
      transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .3s; z-index: 200;
    }
    .dock:disabled { cursor: default; opacity: .9; }
    .dock .ramito { width: 3rem; height: 3rem; border-radius: 50%; background: color-mix(in srgb, var(--cereza) 12%, var(--hoja)); display: grid; place-items: center; position: relative; }
    .dock .ramito svg { width: 2.4rem; height: 2.4rem; overflow: visible; }
    .dock .cuenta { position: absolute; top: -4px; right: -4px; min-width: 1.35rem; height: 1.35rem; padding: 0 .3rem; border-radius: 999px; background: var(--cereza); color: #fff; font-size: .75rem; font-weight: 500; display: grid; place-items: center; }
    .dock .cuenta[hidden] { display: none; }
    .dock strong { font-weight: 500; font-size: .98rem; white-space: nowrap; }
    .dock small { white-space: nowrap; }
    .dock small { display: block; font-size: .78rem; color: var(--tinta-suave); }
    .dock.salta { animation: salta .4s cubic-bezier(.2,.8,.2,1); }
    @keyframes salta { 40% { transform: translateX(-50%) scale(1.08); } }

    /* ---------- La tarjeta del ramo ---------- */
    .tarjeta-fondo {
      position: fixed; inset: 0; z-index: 60; display: grid; place-items: end center;
      background: #2b183055; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      animation: aparece .3s ease;
    }
    .tarjeta-fondo[hidden] { display: none; }
    @keyframes aparece { from { opacity: 0; } }
    .tarjeta {
      width: min(30rem, 100%); max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain;
      background: var(--hoja); color: var(--tinta); border-radius: 26px 26px 0 0;
      padding: 1rem 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
      box-shadow: 0 -20px 50px -20px #0007; animation: sube .45s cubic-bezier(.2,.8,.2,1);
    }
    @media (min-width: 40rem) { .tarjeta-fondo { place-items: center; } .tarjeta { border-radius: 26px; max-height: calc(100dvh - 2rem); } }
    @keyframes sube { from { transform: translateY(40px); opacity: 0; } }
    .tarjeta header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .tarjeta h2 { font-size: 1.7rem; font-weight: 400; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 72; }
    .tarjeta .cerrar { width: 2.6rem; height: 2.6rem; flex: none; border-radius: 50%; border: 0; background: color-mix(in srgb, currentColor 9%, transparent); color: inherit; font-size: 1.5rem; line-height: 1; cursor: pointer; }
    .tarjeta .ayuda { margin: .3rem 0 .6rem; font-size: .88rem; color: var(--tinta-suave); }
    .lienzo { position: relative; border-radius: 20px; overflow: hidden; touch-action: none;
      background: radial-gradient(120% 85% at 50% 30%, #fde3ea 0%, #fff6f2 62%, #fffaf7 100%); }
    .lienzo svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
    .lienzo .fl { cursor: grab; }
    .lienzo .fl.moviendo { cursor: grabbing; }
    .lienzo .basura { opacity: 0; transition: opacity .2s; }
    .lienzo.quitando .basura { opacity: 1; }
    .lienzo .fl.entra { animation: brota .6s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes brota { from { opacity: 0; } }

    .jarrones { display: flex; gap: .6rem; justify-content: center; margin: .9rem 0 .2rem; }
    .jarrones button { display: grid; justify-items: center; gap: .15rem; padding: .35rem .6rem .4rem; border-radius: 14px; border: 1.5px solid transparent; background: none; color: inherit; font: inherit; font-size: .78rem; cursor: pointer; }
    .jarrones button[aria-pressed="true"] { border-color: var(--cereza); background: color-mix(in srgb, var(--cereza) 8%, transparent); }
    .jarrones svg { width: 2.2rem; height: 2.2rem; }
    .nota-campo { display: grid; gap: .35rem; margin-top: .8rem; font-size: .88rem; color: var(--tinta-suave); }
    .nota-campo textarea { min-height: 4.6rem; resize: vertical; font-family: var(--serif); font-size: 1.1rem; line-height: 1.45; }
    .firma { margin: .7rem 0 0; text-align: right; font-family: var(--serif); font-style: italic; font-size: 1.15rem; }
    .nota-leida { margin: 1rem 0 0; font-family: var(--serif); font-size: 1.25rem; line-height: 1.5; white-space: pre-line; text-align: center; }
    .acciones { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
    .acciones .boton { flex: 1 1 auto; justify-content: center; }
    .acciones .secundario { background: transparent; color: var(--tinta); border-color: var(--polvo); }
    .enlace { display: flex; gap: .5rem; margin-top: .8rem; }

    }

    @media (prefers-reduced-motion: reduce) {
      .flor .mece, .estrellas i { animation: none !important; }
    }
  </style>
</head>

  <script src="assets/js/datos.js?v=20261126e"></script>

  <script src="assets/js/site.js?v=20261126e"></script>
  <script>
  (function () {
    const { lista: TIPOS, cabeza, hoja } = window.FLORES;
    const $ = id => document.getElementById(id);
    const prado = $("prado"), capa = $("flores"), dock = $("dock");
    const azar = (a, b) => a + Math.random() * (b - a);
    const entero = (a, b) => Math.floor(azar(a, b + 1));
    const MAX = 30;
    const PIROPOS = ["¡Esa!", "Qué bonita", "Para ti", "Otra más", "Preciosa", "♡", "Linda", "Huele rico"];

    let ramo = [];        // flores juntadas: { t, c, x, y, g, s }
    let jarron = 0;

    function aviso(texto) {
      document.querySelectorAll(".aviso-ramo").forEach(a => a.remove());
      const a = document.createElement("div");
      a.className = "aviso-ramo"; a.setAttribute("role", "status"); a.textContent = texto;
      document.body.append(a); setTimeout(() => a.remove(), 2200);
    }

    /* ================= El cielo ================= */
    $("estrellas").insertAdjacentHTML("beforeend", Array.from({ length: 70 }, (_, i) =>
      `<i class="${i % 9 ? "" : "grande"}" style="left:${azar(0, 100)}%;top:${azar(0, 100)}%;animation-delay:${azar(0, 3).toFixed(2)}s;opacity:${azar(.35, 1).toFixed(2)}"></i>`).join(""));

    const ICONOS = {
      ahora: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>',
      amanecer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 17a7 7 0 0 1 14 0M2 17h20M12 3v4M4.5 9.5l1.5 1.5M19.5 9.5 18 11"/></svg>',
      dia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      atardecer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 16a7 7 0 0 1 14 0M2 16h20M5 20h14M12 9v-6M9 6l3 3 3-3"/></svg>',
      noche: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>',
      despejado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21"/></svg>',
      nublado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.6A3.3 3.3 0 0 0 7 18Z"/></svg>',
      lluvia: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.4 1.6A3.3 3.3 0 0 0 7 14Z"/><path d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/></svg>',
      neblina: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9h14M6 13h15M3 17h12"/></svg>',
      nieve: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 6l2.5-1.5M9.5 19.5 12 18l2.5 1.5"/></svg>',
    };
    const HORAS = [["ahora", "Ahora"], ["amanecer", "Amanecer"], ["dia", "Día"], ["atardecer", "Atardecer"], ["noche", "Noche"]];
    const CLIMAS = [["despejado", "Despejado"], ["nublado", "Nublado"], ["lluvia", "Lluvia"], ["neblina", "Neblina"], ["nieve", "Nieve"]];
    let cielo = { hora: "ahora", clima: "despejado" };
    try { Object.assign(cielo, JSON.parse(localStorage.getItem("nyl-prado") || "{}")); } catch (e) {}

    function horaReal() {
      const h = new Date().getHours() + new Date().getMinutes() / 60;
      if (h >= 5.5 && h < 8) return "amanecer";
      if (h >= 8 && h < 17.5) return "dia";
      if (h >= 17.5 && h < 19.8) return "atardecer";
      return "noche";
    }
    function nubes() {
      const cuantas = { despejado: 4, nublado: 10, lluvia: 12, neblina: 6, nieve: 9 }[cielo.clima] || 4;
      $("nubes").innerHTML = Array.from({ length: cuantas }, (_, i) => {
        const w = azar(90, 220) * (cielo.clima === "lluvia" || cielo.clima === "nublado" ? 1.4 : 1);
        const bolas = Array.from({ length: entero(4, 6) }, (_, k) => `<ellipse cx="${20 + k * 14 + azar(-4, 4)}" cy="${azar(14, 22)}" rx="${azar(14, 22)}" ry="${azar(11, 17)}"/>`).join("");
        return `<div class="nube" style="top:${azar(2, cielo.clima === "despejado" ? 26 : 34)}%;width:${w}px;height:${w * 0.38}px;--d:${azar(90, 200).toFixed(0)}s;--r:${-azar(0, 200).toFixed(0)}s;--o:${azar(.7, .98).toFixed(2)}">
          <svg viewBox="0 0 110 40" preserveAspectRatio="none"><rect x="14" y="20" width="84" height="16" rx="8"/>${bolas}</svg></div>`;
      }).join("");
    }
    $("aves").innerHTML = Array.from({ length: 4 }, (_, i) =>
      `<div class="ave" style="top:${azar(8, 24)}%;--d:${azar(28, 46).toFixed(0)}s;--r:${-azar(0, 40).toFixed(0)}s;transform:scale(${azar(.7, 1.2).toFixed(2)})"><svg viewBox="0 0 18 8"><path d="M0 2 Q4.5 -1 9 5 Q13.5 -1 18 2" fill="none" stroke="#2b2b3a" stroke-width="1.6" stroke-linecap="round"/></svg></div>`).join("");

    function ponerCielo(guardar) {
      const hora = cielo.hora === "ahora" ? horaReal() : cielo.hora;
      const cambioClima = prado.dataset.clima !== cielo.clima;
      prado.dataset.hora = hora; prado.dataset.clima = cielo.clima;
      if (cambioClima || !$("nubes").children.length) nubes();
      $("cielo-boton").innerHTML = ICONOS[cielo.clima === "despejado" ? (hora === "noche" ? "noche" : "dia") : cielo.clima];
      $("chips-hora").innerHTML = HORAS.map(([k, n]) => `<button type="button" data-hora="${k}" aria-pressed="${cielo.hora === k}">${ICONOS[k]}${n}</button>`).join("");
      $("chips-clima").innerHTML = CLIMAS.map(([k, n]) => `<button type="button" data-clima="${k}" aria-pressed="${cielo.clima === k}">${ICONOS[k]}${n}</button>`).join("");
      if (guardar) try { localStorage.setItem("nyl-prado", JSON.stringify(cielo)); } catch (e) {}
      particulas.modo();
    }
    $("cielo-boton").addEventListener("click", () => {
      const p = $("cielo-panel"); p.hidden = !p.hidden;
      $("cielo-boton").setAttribute("aria-expanded", !p.hidden);
    });
    $("cielo-panel").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.hora) cielo.hora = b.dataset.hora;
      if (b.dataset.clima) cielo.clima = b.dataset.clima;
      ponerCielo(true);
    });
    setInterval(() => { if (cielo.hora === "ahora") ponerCielo(); }, 60000);

    /* ---------- Lluvia, nieve, luciérnagas y pétalos ---------- */
    const particulas = (() => {
      const cv = $("particulas"), ctx = cv.getContext("2d");
      let lista = [], tipo = "", W = 0, H = 0, dpr = 1, rafId = 0, rayo = 0;
      function medir() {
        dpr = Math.min(2, devicePixelRatio || 1); W = prado.clientWidth; H = prado.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function nueva(inicio) {
        const area = W * H / 400000;
        if (tipo === "lluvia") return { x: azar(-50, W + 50), y: inicio ? azar(-H, H) : azar(-60, -10), v: azar(13, 20), l: azar(12, 22), a: azar(.25, .55) };
        if (tipo === "nieve") return { x: azar(0, W), y: inicio ? azar(-H, H) : -10, v: azar(.6, 1.6), r: azar(1.2, 3.4), f: azar(0, 6.3), a: azar(.6, 1) };
        if (tipo === "luciernagas") return { x: azar(0, W), y: azar(H * .45, H * .95), vx: azar(-.3, .3), vy: azar(-.3, .3), f: azar(0, 6.3), r: azar(1.4, 2.6) };
        if (tipo === "petalos") return { x: azar(-40, W), y: inicio ? azar(0, H) : azar(-30, H * .4), vx: azar(.4, 1.1), vy: azar(.2, .6), g: azar(0, 6.3), vg: azar(-.04, .04), c: ["#ffc2d4", "#ffe0ea", "#fff3c4", "#ffd6e7"][entero(0, 3)], f: azar(0, 6.3) };
      }
      function cuantas() {
        const area = W * H / 300000;
        return Math.round({ lluvia: 130, nieve: 90, luciernagas: 22, petalos: 14 }[tipo] * Math.max(.8, Math.min(2.4, area)));
      }
      function modo() {
        const hora = prado.dataset.hora, clima = prado.dataset.clima;
        const nuevo = clima === "lluvia" ? "lluvia" : clima === "nieve" ? "nieve"
          : hora === "noche" && clima !== "nublado" ? "luciernagas"
          : (hora === "dia" || hora === "atardecer") && clima === "despejado" ? "petalos" : "";
        if (nuevo === tipo && lista.length) return;
        tipo = nuevo; medir();
        lista = tipo ? Array.from({ length: cuantas() }, () => nueva(true)) : [];
        cancelAnimationFrame(rafId); ctx.clearRect(0, 0, W, H);
        if (tipo && !matchMedia("(prefers-reduced-motion: reduce)").matches) rafId = requestAnimationFrame(cuadro);
        clearTimeout(rayo); if (tipo === "lluvia") truenos();
      }
      function truenos() {
        rayo = setTimeout(() => {
          if (prado.dataset.clima !== "lluvia") return;
          const r = $("relampago"); r.classList.remove("brilla"); void r.offsetWidth; r.classList.add("brilla");
          truenos();
        }, azar(7000, 16000));
      }
      function cuadro(t) {
        ctx.clearRect(0, 0, W, H);
        for (let i = 0; i < lista.length; i++) {
          const p = lista[i];
          if (tipo === "lluvia") {
            p.x -= p.v * .22; p.y += p.v;
            ctx.strokeStyle = `rgba(220,230,245,${p.a})`; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.l * .22, p.y - p.l); ctx.stroke();
            if (p.y > H * azar(.6, 1.05)) {
              ctx.strokeStyle = `rgba(220,230,245,${p.a * .7})`; ctx.beginPath(); ctx.ellipse(p.x, p.y, 4, 1.4, 0, 0, Math.PI * 2); ctx.stroke();
              lista[i] = nueva(false);
            }
          } else if (tipo === "nieve") {
            p.f += .02; p.x += Math.sin(p.f) * .5; p.y += p.v;
            ctx.fillStyle = `rgba(255,255,255,${p.a})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
            if (p.y > H + 5) lista[i] = nueva(false);
          } else if (tipo === "luciernagas") {
            p.f += .03; p.vx += azar(-.04, .04); p.vy += azar(-.04, .04);
            p.vx = Math.max(-.5, Math.min(.5, p.vx)); p.vy = Math.max(-.4, Math.min(.4, p.vy));
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < H * .4 || p.y > H) p.vy *= -1;
            const brillo = (Math.sin(p.f) + 1) / 2;
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 6);
            g.addColorStop(0, `rgba(255,246,160,${.9 * brillo})`); g.addColorStop(1, "rgba(255,246,160,0)");
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 6, 0, Math.PI * 2); ctx.fill();
          } else if (tipo === "petalos") {
            p.f += .03; p.g += p.vg; p.x += p.vx + Math.sin(p.f) * .4; p.y += p.vy + Math.cos(p.f * .7) * .2;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.g); ctx.scale(1, Math.abs(Math.sin(p.f)) * .6 + .4);
            ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(0, 0, 5, 3, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            if (p.x > W + 20 || p.y > H + 20) lista[i] = nueva(false);
          }
        }
        rafId = requestAnimationFrame(cuadro);
      }
      document.addEventListener("visibilitychange", () => { if (document.hidden) cancelAnimationFrame(rafId); else if (tipo) { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(cuadro); } });
      return { modo, medir: () => { const t = tipo; tipo = ""; lista = []; prado.dataset.clima && modo(); } };
    })();

    /* ================= El prado ================= */
    // y es de 0 (horizonte) a 1 (frente): las de enfrente son más grandes
    function crearFlor(y, x, naciendo) {
      const W = prado.clientWidth, H = prado.clientHeight;
      const horizonte = H * 0.36, fondo = H * 1.02;
      const top = horizonte + y * (fondo - horizonte);
      const esc = (0.5 + y * 1.0) * Math.min(1.3, Math.max(0.9, W / 650));
      const t = entero(0, TIPOS.length - 1), c = entero(0, 9);
      const tallo = azar(70, 135), curva = azar(-14, 14);
      const el = document.createElement("div");
      el.className = "flor" + (naciendo ? " nace" : "");
      const ancho = 90, alto = tallo + 60;
      el.style.cssText = `left:${x - (ancho / 2) * esc}px;top:${top - alto * esc}px;width:${ancho * esc}px;height:${alto * esc}px;z-index:${Math.round(y * 100)};--d:${azar(3, 5.5).toFixed(2)}s;--r:${-azar(0, 5).toFixed(2)}s`;
      const lado = Math.random() < .5 ? -1 : 1;
      el.innerHTML = `<svg viewBox="${-ancho / 2} ${-alto} ${ancho} ${alto}" aria-hidden="true"><g class="mece">
          <path d="M0 0 Q${curva} ${-tallo / 2} ${curva * 0.4} ${-tallo}" fill="none" stroke="var(--tallo)" stroke-width="2.6" stroke-linecap="round"/>
          <g transform="translate(${curva * 0.35} ${-tallo * 0.42}) rotate(${lado > 0 ? -28 : 208})">${hoja(azar(14, 20), "var(--tallo)")}</g>
          <g class="cabeza" transform="translate(${curva * 0.4} ${-tallo}) rotate(${azar(-14, 14).toFixed(1)})">${cabeza(t, c)}</g>
          <circle class="toque" cx="${curva * 0.4}" cy="${-tallo - 6}" r="30" fill="transparent"/>
        </g></svg>`;
      el.dataset.t = t; el.dataset.c = c; el.dataset.y = y; el.dataset.x = x;
      capa.append(el);
      if (naciendo) setTimeout(() => el.classList.remove("nace"), 1200);
      return el;
    }

    function crearPasto(y, x) {
      const W = prado.clientWidth, H = prado.clientHeight;
      const horizonte = H * 0.36, fondo = H * 1.04;
      const top = horizonte + y * (fondo - horizonte);
      const esc = 0.5 + y * 0.9;
      const el = document.createElement("div");
      el.className = "flor pasto-mata";
      el.style.cssText = `left:${x - 30 * esc}px;top:${top - 40 * esc}px;width:${60 * esc}px;height:${40 * esc}px;z-index:${Math.round(y * 100)};--d:${azar(2.5, 4).toFixed(2)}s;--r:${-azar(0, 4).toFixed(2)}s`;
      let hojas = "";
      for (let i = 0; i < 7; i++) {
        const bx = azar(-14, 14), h = azar(18, 38), cx = bx + azar(-10, 10);
        hojas += `<path d="M${bx - 1.6} 0 Q${cx} ${-h * 0.6} ${cx + azar(-6, 6)} ${-h} Q${cx + 1} ${-h * 0.55} ${bx + 1.6} 0Z" fill="${i % 2 ? "var(--pasto)" : "var(--pasto-2)"}"/>`;
      }
      el.innerHTML = `<svg viewBox="-30 -40 60 40" aria-hidden="true"><g class="mece">${hojas}</g></svg>`;
      capa.append(el);
    }

    // Árboles y arbustos cerca del horizonte
    function crearArbol(y, x) {
      const H = prado.clientHeight, W = prado.clientWidth;
      const horizonte = H * 0.36, fondo = H * 1.02;
      const top = horizonte + y * (fondo - horizonte);
      const esc = (0.45 + y * 1.2) * Math.min(1.3, Math.max(0.9, W / 650));
      const tipo = entero(0, 2);
      const el = document.createElement("div");
      el.className = "flor pasto-mata";
      let dib, w = 70, h = 90;
      if (tipo === 0) { // árbol redondo
        dib = `<path d="M-3 0 L-2 -34 L2 -34 L3 0Z" fill="var(--tronco)"/>
          <circle cx="-12" cy="-42" r="16" fill="var(--arbol-2)"/><circle cx="12" cy="-44" r="17" fill="var(--arbol-2)"/>
          <circle cx="0" cy="-58" r="19" fill="var(--arbol)"/><circle cx="-8" cy="-46" r="14" fill="var(--arbol)"/><circle cx="10" cy="-50" r="13" fill="var(--arbol)"/>`;
      } else if (tipo === 1) { // pino
        dib = `<rect x="-2.5" y="-12" width="5" height="12" fill="var(--tronco)"/>
          <path d="M0 -84 L14 -56 L8 -56 L20 -34 L12 -34 L24 -12 L-24 -12 L-12 -34 L-20 -34 L-8 -56 L-14 -56Z" fill="var(--arbol-2)"/>
          <path d="M0 -84 L14 -56 L8 -56 L20 -34 L12 -34 L24 -12 L0 -12Z" fill="var(--arbol)" opacity=".55"/>`;
      } else { // arbusto
        h = 40; dib = `<ellipse cx="-12" cy="-10" rx="16" ry="12" fill="var(--arbol-2)"/><ellipse cx="10" cy="-12" rx="18" ry="14" fill="var(--arbol)"/><ellipse cx="-2" cy="-18" rx="13" ry="11" fill="var(--arbol)"/>`;
      }
      el.style.cssText = `left:${x - (w / 2) * esc}px;top:${top - h * esc}px;width:${w * esc}px;height:${h * esc}px;z-index:${Math.round(y * 100)};--d:${azar(5, 8).toFixed(2)}s;--r:${-azar(0, 6).toFixed(2)}s`;
      el.innerHTML = `<svg viewBox="${-w / 2} ${-h} ${w} ${h}" aria-hidden="true"><g class="mece" style="animation-name:mecer-suave">${dib}</g></svg>`;
      capa.append(el);
    }

    function sembrar() {
      capa.innerHTML = "";
      const W = prado.clientWidth, H = prado.clientHeight;
      const arboles = Math.round(Math.max(7, W / 55));
      for (let i = 0; i < arboles; i++) crearArbol(azar(-0.02, 0.2), azar(-20, W + 20));
      const cuantas = Math.round(Math.min(120, Math.max(70, W * H / 5200)));
      // filas de atrás hacia adelante, repartidas sin amontonarse
      for (let i = 0; i < cuantas; i++) {
        const y = Math.pow((i + Math.random()) / cuantas, 0.85) * 0.86 + 0.04;
        crearFlor(y, azar(W * 0.04, W * 0.96));
      }
      const matas = Math.round(W / 26);
      for (let i = 0; i < matas; i++) crearPasto(azar(0.55, 1), azar(0, W));
    }

    /* ---------- Juntar ---------- */
    let primera = true;
    function juntar(el, px, py) {
      if (!el || el.classList.contains("cortada")) return;
      if (ramo.length >= MAX) { aviso("Tu ramo ya está lleno ♡"); return; }
      el.classList.add("cortada");
      const t = +el.dataset.t, c = +el.dataset.c;
      ramo.push({ t, c });
      if (primera) { primera = false; $("guia").classList.add("escondida"); }

      // la flor vuela al ramito
      const cab = el.querySelector(".cabeza").getBoundingClientRect();
      const dest = dock.querySelector(".ramito").getBoundingClientRect();
      const v = document.createElement("div");
      v.className = "vuela";
      const tam = Math.max(cab.width, cab.height, 30);
      v.style.cssText = `left:${cab.left + cab.width / 2 - tam / 2}px;top:${cab.top + cab.height / 2 - tam / 2}px;width:${tam}px;height:${tam}px`;
      v.innerHTML = `<svg viewBox="-30 -30 60 60">${cabeza(t, c)}</svg>`;
      document.body.append(v);
      const dx = dest.left + dest.width / 2 - (cab.left + cab.width / 2), dy = dest.top + dest.height / 2 - (cab.top + cab.height / 2);
      v.animate([
        { transform: "translate(0,0) scale(1) rotate(0deg)", opacity: 1 },
        { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 60}px) scale(.9) rotate(90deg)`, opacity: 1, offset: 0.5 },
        { transform: `translate(${dx}px, ${dy}px) scale(.35) rotate(200deg)`, opacity: 0.2 },
      ], { duration: 650, easing: "cubic-bezier(.4,0,.2,1)" }).onfinish = () => { v.remove(); pintarDock(true); };

      if (Math.random() < 0.45) {
        const p = document.createElement("div");
        p.className = "piropo"; p.textContent = PIROPOS[entero(0, PIROPOS.length - 1)];
        p.style.left = (cab.left + cab.width / 2) + "px"; p.style.top = (cab.top - 6) + "px";
        document.body.append(p); setTimeout(() => p.remove(), 1300);
      }
      if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}

      // vuelve a crecer otra flor en otro lado
      const y = +el.dataset.y;
      setTimeout(() => el.remove(), 500);
      setTimeout(() => crearFlor(Math.min(0.9, Math.max(0.04, y + azar(-0.08, 0.08))), azar(prado.clientWidth * 0.04, prado.clientWidth * 0.96), true), azar(2500, 6000));
    }

    function florEn(x, y) {
      const el = document.elementFromPoint(x, y);
      return el && el.classList && el.classList.contains("toque") ? el.closest(".flor") : null;
    }

    let arrastrando = false;
    prado.addEventListener("pointerdown", e => {
      if (e.target.closest(".dock, .cielo-boton, .cielo-panel")) return;
      $("cielo-panel").hidden = true; $("cielo-boton").setAttribute("aria-expanded", "false");
      arrastrando = true; prado.classList.add("juntando");
      try { prado.setPointerCapture(e.pointerId); } catch (er) {}
      juntar(florEn(e.clientX, e.clientY), e.clientX, e.clientY);
    });
    prado.addEventListener("pointermove", e => {
      if (!arrastrando) return;
      const ev = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      (ev.length ? ev : [e]).forEach(p => juntar(florEn(p.clientX, p.clientY), p.clientX, p.clientY));
    });
    const soltar = () => { arrastrando = false; prado.classList.remove("juntando"); };
    prado.addEventListener("pointerup", soltar);
    prado.addEventListener("pointercancel", soltar);

    function pintarDock(saltar) {
      const n = ramo.length;
      $("cuenta").textContent = n; $("cuenta").hidden = !n;
      dock.disabled = !n;
      $("dock-titulo").textContent = n ? "Ver tu ramo" : "Tu ramo";
      $("dock-sub").textContent = n ? `${n} ${n === 1 ? "flor" : "flores"}` : "Junta algunas flores";
      const ult = ramo.slice(-3);
      ["dock-f1", "dock-f2", "dock-f3"].forEach((id, i) => { const f = ult[i]; $(id).innerHTML = f ? cabeza(f.t, f.c) : ""; });
      if (saltar) { dock.classList.remove("salta"); void dock.offsetWidth; dock.classList.add("salta"); }
    }
    dock.addEventListener("click", () => abrirTarjeta(false));

    let anchoAntes = 0;
    function alCambiarTamano() {
      if (Math.abs(prado.clientWidth - anchoAntes) < 60 && capa.children.length) return;
      anchoAntes = prado.clientWidth; sembrar(); particulas.medir();
    }
    let tRes; addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(alCambiarTamano, 250); });

    /* ================= El ramo en el florero ================= */
    const BOCA = { x: 200, y: 352 };
    const JARRONES = [
      { nombre: "Vidrio", frente: `<path d="M150 340 C146 380 140 420 148 470 C152 492 248 492 252 470 C260 420 254 380 250 340Z" fill="#cfe8f2" fill-opacity=".38" stroke="#ffffff" stroke-opacity=".8" stroke-width="2.5"/>
          <path d="M152 392 C190 386 214 398 249 391 L251 420 C256 450 254 466 250 474 C246 490 154 490 150 474 C146 462 145 440 149 420Z" fill="#9fd0e6" fill-opacity=".35"/>
          <path d="M162 352 C158 390 156 430 162 468" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="200" cy="340" rx="50" ry="7" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="2.5"/>`, boca: { y: 340, a: 44 } },
      { nombre: "Barro", frente: `<path d="M168 334 L232 334 C232 346 228 352 240 362 C276 388 276 452 246 480 C236 492 164 492 154 480 C124 452 124 388 160 362 C172 352 168 346 168 334Z" fill="#c8704a"/>
          <path d="M131 418 C170 428 230 428 269 418 L268 432 C230 442 170 442 132 432Z" fill="#a8532f"/>
          <path d="M150 372 C138 392 136 420 144 446" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="5" stroke-linecap="round"/>
`, atras: `<ellipse cx="200" cy="334" rx="33" ry="6" fill="#6e321a"/><ellipse cx="200" cy="333" rx="33" ry="6" fill="none" stroke="#a8532f" stroke-width="2"/>`, boca: { y: 334, a: 30 } },
      { nombre: "Porcelana", frente: `<path d="M176 330 L224 330 C224 344 220 350 232 360 C262 382 270 430 252 466 C244 486 156 486 148 466 C130 430 138 382 168 360 C180 350 176 344 176 330Z" fill="#fbf8f4" stroke="#e2dad2" stroke-width="1.5"/>
          <path d="M141 410 C180 420 220 420 259 410" fill="none" stroke="#3f6fd1" stroke-width="3"/>
          <path d="M146 440 C182 448 218 448 254 440" fill="none" stroke="#3f6fd1" stroke-width="2"/>
          <g fill="none" stroke="#3f6fd1" stroke-width="1.6"><path d="M170 425 q6 -8 12 0 q6 8 12 0 q6 -8 12 0 q6 8 12 0 q6 -8 12 0"/></g>
`, atras: `<ellipse cx="200" cy="330" rx="24" ry="5" fill="#cfc4ba"/><ellipse cx="200" cy="329.5" rx="24" ry="5" fill="none" stroke="#e2dad2" stroke-width="1.5"/>`, boca: { y: 330, a: 21 } },
    ];

    $("jarrones").innerHTML = JARRONES.map((j, i) =>
      `<button type="button" data-j="${i}" aria-pressed="${i === jarron}"><svg viewBox="120 320 160 180">${j.frente}</svg>${j.nombre}</button>`).join("");
    $("jarrones").addEventListener("click", e => {
      const b = e.target.closest("[data-j]"); if (!b) return;
      jarron = +b.dataset.j;
      $("jarrones").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
      pintarRamo();
    });

    // Acomoda las flores en forma de domo, como un ramo de verdad.
    // Las que ya tienen lugar se quedan donde están; las nuevas van a los huecos.
    const ANG_MAX = 62;
    const angulo = f => Math.atan2(f.x - BOCA.x, (BOCA.y - 48) - f.y) * 180 / Math.PI;
    function acomodar(lista) {
      const nuevas = lista.filter(f => f.x == null);
      if (!nuevas.length) return;
      // revolver las nuevas para que se mezclen colores y tipos
      nuevas.sort(() => Math.random() - 0.5);
      nuevas.forEach(f => {
        const angs = lista.filter(o => o.x != null).map(angulo).sort((a, b) => a - b);
        let ang;
        if (!angs.length) ang = azar(-12, 12);
        else {
          // busca el hueco más grande entre -62° y 62°
          const puntos = [-ANG_MAX - 14, ...angs, ANG_MAX + 14];
          let mejor = 0, centro = 0;
          for (let i = 0; i < puntos.length - 1; i++) {
            const hueco = puntos[i + 1] - puntos[i];
            if (hueco > mejor) { mejor = hueco; centro = (puntos[i] + puntos[i + 1]) / 2; }
          }
          ang = Math.max(-ANG_MAX, Math.min(ANG_MAX, centro + azar(-4, 4)));
        }
        const rad = ang * Math.PI / 180;
        const centrada = 1 - Math.abs(ang) / ANG_MAX;
        // capa de atrás (más alta) o de enfrente (más baja), para que se vea lleno
        const radio = (Math.random() < 0.5 ? azar(150, 185) : azar(105, 140)) - (1 - centrada) * 22;
        f.x = Math.round(BOCA.x + Math.sin(rad) * radio * 1.1);
        f.y = Math.round(BOCA.y - 48 - Math.cos(rad) * radio);
        f.g = Math.round(azar(-20, 20) + ang * 0.4);
        f.s = +azar(1.35, 1.65).toFixed(2);
        separar(f, lista);
      });
      lista.sort((a, b) => a.y - b.y); // las más altas van atrás
    }
    // Empuja una flor si quedó encima de otra
    function separar(f, lista) {
      for (let vuelta = 0; vuelta < 14; vuelta++) {
        let movio = false;
        lista.forEach(o => {
          if (o === f || o.x == null) return;
          const dx = f.x - o.x, dy = f.y - o.y, d = Math.hypot(dx, dy) || 1;
          const minimo = 15.5 * (f.s + o.s);
          if (d < minimo) {
            const emp = (minimo - d) / 2 + 1;
            f.x += dx / d * emp; f.y += dy / d * emp; movio = true;
          }
        });
        f.x = Math.round(Math.max(52, Math.min(348, f.x)));
        f.y = Math.round(Math.max(70, Math.min(300, f.y)));
        if (!movio) break;
      }
    }

    // Cada tallo sube desde el fondo del florero, sale por la boca y se curva hacia su flor
    function puntos(f) {
      const B = (JARRONES[jarron] || JARRONES[0]).boca;
      const mx = BOCA.x + Math.max(-B.a * 0.8, Math.min(B.a * 0.8, (f.x - BOCA.x) * 0.22));
      const my = B.y + 4;
      const fondo = { x: BOCA.x + (mx - BOCA.x) * 0.35, y: 470 };
      const c = { x: mx + (f.x - mx) * 0.08, y: my - (my - f.y) * 0.5 };
      return { fondo, mx, my, c };
    }
    function tallo(f) {
      const { fondo, mx, my, c } = puntos(f);
      return `M${fondo.x.toFixed(1)} ${fondo.y} L${mx.toFixed(1)} ${my} Q${c.x.toFixed(1)} ${c.y.toFixed(1)} ${f.x} ${f.y}`;
    }
    function hojaDe(f, i) {
      if (i % 3) return "";
      const { mx, my, c } = puntos(f);
      if (my - f.y < 90) return ""; // tallo muy corto: sin hoja
      const t = 0.45; // a la mitad del tramo que ya salió del florero
      const x = (1 - t) ** 2 * mx + 2 * (1 - t) * t * c.x + t * t * f.x, y = (1 - t) ** 2 * my + 2 * (1 - t) * t * c.y + t * t * f.y;
      const lado = f.x < BOCA.x ? 200 : -20;
      return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${lado}) scale(1.25)">${hoja(16, "#5f9140")}</g>`;
    }

    function svgRamo(lista, j, extra = "") {
      const J = JARRONES[j] || JARRONES[0];
      const tallos = lista.map((f, i) => `<path id="s-${i}" d="${tallo(f)}" fill="none" stroke="#4f8a33" stroke-width="3.2" stroke-linecap="round"/>${hojaDe(f, i)}`).join("");
      const cabezas = lista.map((f, i) => `<g class="fl" id="f-${i}" data-i="${i}" transform="translate(${f.x} ${f.y}) rotate(${f.g}) scale(${f.s})">${cabeza(f.t, f.c)}<circle r="26" fill="transparent"/></g>`).join("");
      return `<ellipse cx="200" cy="492" rx="92" ry="9" fill="#2b183022"/>
        ${J.atras || ""}${tallos}${J.frente}
        <g class="cabezas">${cabezas}</g>${extra}`;
    }

    function pintarRamo(animar) {
      const basura = `<g class="basura"><rect x="0" y="470" width="400" height="50" fill="#b4234f22"/><text x="200" y="501" text-anchor="middle" font-size="15" fill="#b4234f" font-family="Figtree, sans-serif">Suelta aquí para quitarla</text></g>`;
      $("ramo").innerHTML = svgRamo(ramo, jarron, modoVer ? "" : basura);
      if (animar) $("ramo").querySelectorAll(".fl").forEach((g, i) => { g.classList.add("entra"); g.style.animationDelay = (i * 45) + "ms"; });
    }

    /* ---------- Mover flores dentro del ramo ---------- */
    let mov = null;
    const svgPunto = e => { const s = $("ramo"), p = s.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(s.getScreenCTM().inverse()); };
    $("ramo").addEventListener("pointerdown", e => {
      if (modoVer) return;
      const g = e.target.closest(".fl"); if (!g) return;
      e.preventDefault();
      const i = +g.dataset.i, p = svgPunto(e);
      mov = { i, g, dx: ramo[i].x - p.x, dy: ramo[i].y - p.y, x0: e.clientX, y0: e.clientY, movio: false };
      g.classList.add("moviendo");
      $("ramo").querySelector(".cabezas").append(g); // al frente
      try { $("ramo").setPointerCapture(e.pointerId); } catch (er) {}
    });
    $("ramo").addEventListener("pointermove", e => {
      if (!mov) return;
      if (Math.hypot(e.clientX - mov.x0, e.clientY - mov.y0) > 5) mov.movio = true;
      if (!mov.movio) return;
      const p = svgPunto(e), f = ramo[mov.i];
      f.x = Math.round(Math.max(20, Math.min(380, p.x + mov.dx)));
      f.y = Math.round(Math.max(24, Math.min(512, p.y + mov.dy)));
      mov.g.setAttribute("transform", `translate(${f.x} ${f.y}) rotate(${f.g}) scale(${f.s})`);
      const s = $("s-" + mov.i); if (s) s.setAttribute("d", tallo({ ...f, y: Math.min(f.y, 330) }));
      $("lienzo").classList.toggle("quitando", f.y > 455);
    });
    function terminarMov() {
      if (!mov) return;
      const f = ramo[mov.i];
      if (!mov.movio) { f.g = (f.g + 35) % 360; pintarRamo(); }
      else if (f.y > 455) { ramo.splice(mov.i, 1); aviso("Flor quitada"); pintarDock(); if (!ramo.length) cerrarTarjeta(); else pintarRamo(); }
      else { if (f.y > 330) f.y = 330; ramo.sort((a, b) => a.y - b.y); pintarRamo(); }
      $("lienzo").classList.remove("quitando");
      mov = null;
    }
    $("ramo").addEventListener("pointerup", terminarMov);
    $("ramo").addEventListener("pointercancel", terminarMov);

    /* ================= La tarjeta ================= */
    let modoVer = false, recibido = null;
    const fondo = $("tarjeta-fondo");
    const yo = () => (window.Sesion && Sesion.nombre) || "Luis";
    const otro = n => n === "Nadia" ? "Luis" : "Nadia";

    function abrirTarjeta(ver) {
      modoVer = !!ver;
      $("tarjeta").classList.toggle("modo-ver", modoVer);
      if (modoVer) {
        $("t-titulo").textContent = "Un ramo para ti";
        $("t-de-arriba").textContent = `${recibido.d || "Alguien"} juntó ${recibido.f.length} ${recibido.f.length === 1 ? "flor" : "flores"} para ti.`;
        $("nota-leida").textContent = recibido.n || "";
        $("firma").textContent = `Con amor, ${recibido.d || ""}`;
        ramo = recibido.f.map(f => ({ ...f })); jarron = recibido.v || 0;
      } else {
        $("t-titulo").textContent = "Tu ramo";
        $("firma").textContent = `Para ${otro(yo())}, con amor, ${yo()}`;
        acomodar(ramo);
        $("enlace").hidden = true;
      }
      $("jarrones").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.j === jarron));
      fondo.hidden = false;
      $("tarjeta").scrollTop = 0;
      pintarRamo(true);
    }
    function cerrarTarjeta() { fondo.hidden = true; }
    $("t-cerrar").addEventListener("click", cerrarTarjeta);
    $("seguir").addEventListener("click", cerrarTarjeta);
    fondo.addEventListener("click", e => { if (e.target === fondo && !modoVer) cerrarTarjeta(); });
    addEventListener("keydown", e => { if (e.key === "Escape" && !fondo.hidden && !modoVer) cerrarTarjeta(); });
    $("vaciar").addEventListener("click", () => { ramo = []; $("nota").value = ""; pintarDock(); cerrarTarjeta(); aviso("Listo, a juntar otra vez"); });

    /* ---------- Enviar: todo el ramo va dentro del link ---------- */
    function codificar(obj) {
      const bytes = new TextEncoder().encode(JSON.stringify(obj));
      let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }
    function decodificar(txt) {
      const bin = atob(txt.replace(/-/g, "+").replace(/_/g, "/"));
      return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    }
    function datosRamo() {
      return { v: jarron, n: $("nota").value.trim().slice(0, 280), d: yo(), f: ramo.map(f => [f.t, f.c, f.x, f.y, f.g, f.s]) };
    }
    $("enviar").addEventListener("click", async () => {
      const url = location.origin + location.pathname + "#r=" + codificar(datosRamo());
      $("enlace-txt").value = url; $("enlace").hidden = false;
      if (navigator.share) {
        try { await navigator.share({ title: "Un ramo para ti", text: `${yo()} te juntó un ramo ♡`, url }); return; }
        catch (e) { if (e && e.name === "AbortError") return; }
      }
      copiar(url);
    });
    async function copiar(url) {
      try { await navigator.clipboard.writeText(url); aviso("Link copiado. Mándaselo ♡"); }
      catch (e) { $("enlace-txt").select(); aviso("Copia el link de abajo"); }
    }
    $("copiar").addEventListener("click", () => copiar($("enlace-txt").value));

    /* ---------- Descargar como imagen ---------- */
    function partirTexto(t, max) {
      const palabras = t.split(/\s+/), lineas = []; let l = "";
      palabras.forEach(p => { if ((l + " " + p).trim().length > max) { lineas.push(l.trim()); l = p; } else l += " " + p; });
      if (l.trim()) lineas.push(l.trim());
      return lineas.slice(0, 6);
    }
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    async function descargar() {
      const nota = modoVer ? (recibido.n || "") : $("nota").value.trim();
      const firma = $("firma").textContent;
      const lineas = nota ? partirTexto(nota, 34) : [];
      const altoTexto = 40 + lineas.length * 28 + 40;
      const H = 560 + altoTexto;
      const texto = lineas.map((l, i) => `<text x="200" y="${560 + i * 28}" text-anchor="middle" font-size="20" fill="#2b1830" font-family="Georgia, serif">${esc(l)}</text>`).join("") +
        `<text x="${360}" y="${560 + lineas.length * 28 + 20}" text-anchor="end" font-size="18" font-style="italic" fill="#b4234f" font-family="Georgia, serif">${esc(firma)}</text>`;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 ${H}" width="1200" height="${H * 3}">
        <rect width="400" height="${H}" fill="#fffdfb"/><rect width="400" height="520" fill="#fbe9ee"/>
        ${svgRamo(ramo, jarron)}${texto}
        <text x="20" y="${H - 14}" font-size="11" fill="#6e5a70" font-family="Georgia, serif">nadiapp.site</text></svg>`;
      const img = new Image();
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace(/var\(--tallo\)/g, "#5b8a37"));
      await img.decode();
      const cv = document.createElement("canvas"); cv.width = 1200; cv.height = H * 3;
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b); a.download = "ramo-para-ti.png"; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      }, "image/png");
    }
    $("descargar").addEventListener("click", () => descargar().catch(() => aviso("No se pudo descargar")));
    $("descargar-2").addEventListener("click", () => descargar().catch(() => aviso("No se pudo descargar")));

    $("hacer-uno").addEventListener("click", () => {
      history.replaceState(null, "", location.pathname);
      recibido = null; ramo = []; jarron = 0; modoVer = false;
      pintarDock(); cerrarTarjeta();
    });

    /* ================= Empezar ================= */
    anchoAntes = prado.clientWidth;
    sembrar();
    ponerCielo();
    pintarDock();

    // ¿Llegó con un ramo en el link?
    const m = location.hash.match(/r=([\w-]+)/);
    if (m) {
      try {
        const d = decodificar(m[1]);
        recibido = { v: +d.v || 0, n: String(d.n || ""), d: String(d.d || ""), f: (d.f || []).slice(0, MAX).map(a => ({ t: +a[0] || 0, c: +a[1] || 0, x: +a[2] || 200, y: +a[3] || 200, g: +a[4] || 0, s: +a[5] || 1.2 })) };
        $("guia").classList.add("escondida");
        setTimeout(() => abrirTarjeta(true), 350);
      } catch (e) { aviso("Ese link de ramo no se pudo abrir"); }
    }
  })();
  </script>
</body>
</html>
